services:
  mysql:
    image: mysql:8.4
    container_name: medibook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # Run MySQL on clinic time so NOW() / CURRENT_TIMESTAMP match the app's clock.
      TZ: ${CLINIC_TZ:-Africa/Kigali}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # schema.sql then seed.sql run automatically (alphabetical order),
      # but ONLY the first time, when the mysql_data volume is empty.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medibook-redis
    restart: unless-stopped
    # Append-only file: waitlists and pending jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
