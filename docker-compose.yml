services:
  mysql:
    image: mysql:8.4
    container_name: medibook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # schema.sql then seed.sql run automatically (alphabetical order),
      # but ONLY the first time, when the mysql_data volume is empty.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medibook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
